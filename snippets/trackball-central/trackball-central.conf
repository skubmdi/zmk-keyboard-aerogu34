# Central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_KEYBOARD_NAME="Aerogu34"

# Zephyr 4 xiao_ble defaults bind the UART console to a second USB CDC ACM
# endpoint, which collides with the studio-rpc-usb-uart endpoint that DYA
# Studio expects to open. Disable the board-default serial backend so only
# the Studio RPC CDC ACM is exposed.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# PAW3222 trackball
CONFIG_PAW3222=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y

# BLE
# 6 slots = 5 host profiles (BT_SEL 0-4) + 1 split peripheral.
# Each ZMK BLE profile consumes one paired slot; ZMK derives the visible
# profile count as BT_MAX_PAIRED - ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_DIS=y

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio modules (Central side)
# ========================================
# BLE management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Battery history
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
# Record battery history during USB-connected sessions
# (otherwise DYA Studio sessions over USB record nothing)
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# Settings RPC (idle/sleep)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split event relay (central <-> peripheral)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Bumped from 768 to 2048 after user reports of DYA Studio crashes during
# active use (Studio RPC + split-run traffic overflowed the smaller stack).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=2048

# DYA Studio stability
# Prevents crashes when Studio RPC handles keymap edits / trackball tuning
# alongside HID traffic. Applied together based on RaZiLy's fix set.
# 6000 matches the dya2 reference for the 2026.08 Studio feature set.
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Runtime input processor (trackball settings via DYA Studio)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# REQUIRED since runtime-input-processor @ 5d3771e (2026-07-16): the
# Studio "Refresh List" notifications run on ZMK's shared low-priority
# work queue, and encoding them needs more than its 768 B default stack.
# Without this, opening the DYA Studio Trackball tab faults the firmware
# (MPU stack guard) -> "Failed to load layers: Operation timed out" and
# the keyboard stops responding. A module Kconfig default cannot raise a
# shared ZMK thread's stack, so it must be set here.
# 4096 (up from the module README's 2048 minimum) matches the dya2
# reference now that Studio 2026.08 keeps every tab mounted and the
# extra RPC subsystems below add concurrent traffic.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096

# ========================================
# DYA Studio 2026.08.09.0 feature set
# (mirrors cormoran's zmk-keyboard-dya2 reference config)
# ========================================
# Fast keymap loading (per-layer incremental; Studio falls back to the
# official protocol when absent)
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y

# Macro & Combo tab (runtime editors)
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# Runtime combo slots shown in the Studio Macro & Combo tab. Module default
# is 8, which users hit quickly on a 34-key board that leans on combos.
# ~64 B RAM per slot; 63 is the module's hard maximum (~4 KB). Users asked
# for 35+, so go straight to the ceiling rather than re-raise later.
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=63
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# Same story for macro slots (module default 8, hard max 16). The shared
# name+body pool is doubled so 16 macros don't starve each other.
CONFIG_ZMK_RUNTIME_MACRO_COUNT=16
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=2048
# Stable behavior references for runtime macro/combo + fast-keymap.
# NOTE: changing the local-id type invalidates previously stored Studio
# keymap edits - expect a one-time keymap reset to the flashed default.
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# Connection tab: OS detection + default layer selector
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# Trackball tab: live sensor stream view
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# Custom Subsystems tab (browse/edit vendor settings)
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# Troubleshooting tab: crash reasons + device info
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# RPC plumbing sized per the dya2 reference (all tabs stay mounted in
# Studio 2026.08, so concurrent RPC load is higher than before)
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Setting persistence
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

# ========================================
# Prospector
# ========================================
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Aerogu34"
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=10000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=2000
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30
