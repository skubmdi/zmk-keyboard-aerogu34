# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio modules (Peripheral side)
# ========================================
# Battery history (data collection on peripheral)
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC (receive settings changes from central)
CONFIG_ZMK_SETTINGS_RPC=y

# Split event relay (peripheral -> central)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# DYA Studio 2026.08: custom-settings values relay across the split so
# central-side Studio edits reach peripheral-stored settings. Sizes per
# the dya2 reference peripheral config.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Setting persistence
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000
